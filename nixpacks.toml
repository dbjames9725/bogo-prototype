[phases.setup]
nixPkgs = ["nodejs", "chromium", "nss", "atk", "cups", "pango", "cairo", "libX11", "libXcomposite", "libXdamage", "libXext", "libXfixes", "libXrandr", "libxcb", "alsa-lib"]

[phases.build]
cmds = ["npm install", "npx playwright install chromium --with-deps"]

[start]
cmd = "npx tsx app/worker/server.ts"
